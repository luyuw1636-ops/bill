<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f4a8a">
<title>日元记账本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
body{margin:0}[hidden]{display:none!important}img{max-width:100%}
/* Layout: one narrow app column — summary first, quick entry, then month chart, categories and a receipt-style log */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --ink:#1d2433; --muted:#6a7287; --line:#dfe2ea;
  --accent:#2f4a8a; --accent-soft:#e6ebf6; --paper:#fbfaf6;
  --ok:#2c7a57; --warn:#b26b00; --bad:#c23b32; --bad-soft:#fbe9e7; --warn-soft:#fdf1dd; --ok-soft:#e3f2ea; --hero:#2f4a8a;
  --f-display:"Zen Maru Gothic","Noto Sans SC","Hiragino Sans",sans-serif;
  --f-body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151c; --surface:#1b202b; --ink:#e8ebf2; --muted:#9aa2b6; --line:#2c3342;
  --accent:#8fa8e6; --accent-soft:#25304a; --paper:#1f2430;
  --ok:#5cc490; --warn:#e8a64a; --bad:#f07a6f; --bad-soft:#3a2224; --warn-soft:#3a2f1c; --ok-soft:#1d3329; --hero:#2b3f72; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151c; --surface:#1b202b; --ink:#e8ebf2; --muted:#9aa2b6; --line:#2c3342;
  --accent:#8fa8e6; --accent-soft:#25304a; --paper:#1f2430;
  --ok:#5cc490; --warn:#e8a64a; --bad:#f07a6f; --bad-soft:#3a2224; --warn-soft:#3a2f1c; --ok-soft:#1d3329; --hero:#2b3f72; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
h1{font-family:var(--f-display);font-size:22px;margin:0;letter-spacing:.02em}
h2{font-family:var(--f-display);font-size:16px;margin:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.month{display:flex;align-items:center;gap:4px}
.month span{min-width:92px;text-align:center;font-weight:500}
button{font:inherit;color:inherit;cursor:pointer}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:36px;height:36px;font-size:18px;line-height:1}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.label{font-size:12px;color:var(--muted);letter-spacing:.06em}
.hero{background:var(--hero);color:#fff;border:none}
.hero .label{color:rgba(255,255,255,.75)}
.hero-amt{font-family:var(--f-num);font-size:36px;font-weight:600;letter-spacing:-.01em;line-height:1.1}
.hero-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.budget-edit{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:4px 10px;font-size:13px}
.bar{height:10px;background:rgba(255,255,255,.22);border-radius:99px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:#fff;border-radius:99px;transition:width .3s}
.bar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:rgba(255,255,255,.85)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:rgba(255,255,255,.12);border-radius:10px;padding:8px 10px;min-width:0}
.stat .v{font-family:var(--f-num);font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alert{border-radius:12px;padding:10px 14px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.alert.ok{background:var(--ok-soft);color:var(--ok)}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.bad{background:var(--bad-soft);color:var(--bad)}
.alert .dot{width:8px;height:8px;border-radius:50%;background:currentColor;margin-top:7px;flex:none}
form{display:flex;flex-direction:column;gap:12px}
.amt-wrap{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;background:var(--bg)}
.amt-wrap span{font-family:var(--f-num);font-size:22px;color:var(--muted)}
.amt-wrap input{border:0;background:transparent;font-family:var(--f-num);font-size:26px;font-weight:600;padding:10px 8px;width:100%;color:var(--ink);min-width:0}
.amt-wrap input:focus{outline:none}
.amt-wrap:focus-within{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:inherit;background:var(--bg);color:var(--ink)}
.row input[type=date]{flex:0 0 150px}
.primary{background:var(--accent);color:var(--surface);border:0;border-radius:12px;padding:12px;font-weight:700;font-size:16px}
.primary:disabled{opacity:.45;cursor:default}
.hint{font-size:12px;color:var(--muted)}
.toast{font-size:13px;color:var(--ok);min-height:1.2em}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-num);font-size:10px}
.cats{display:flex;flex-direction:column;gap:10px}
.cat{display:grid;grid-template-columns:5.5em 1fr auto;gap:10px;align-items:center;font-size:14px}
.cat .track{height:8px;background:var(--accent-soft);border-radius:99px;overflow:hidden}
.cat .track i{display:block;height:100%;background:var(--accent);border-radius:99px}
.cat .v{font-family:var(--f-num);font-size:13px;text-align:right;white-space:nowrap}
.cat .pct{color:var(--muted);font-size:11px;margin-left:4px}
.receipt{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:16px 16px 20px;position:relative;
  -webkit-mask:radial-gradient(circle 6px at 50% 100%,transparent 98%,#000) 0 0/14px 100% repeat-x;mask:radial-gradient(circle 6px at 50% 100%,transparent 98%,#000) 0 0/14px 100% repeat-x;padding-bottom:26px}
.receipt h2{text-align:center;letter-spacing:.2em}
.rc-sub{text-align:center;font-family:var(--f-num);font-size:11px;color:var(--muted);margin-top:-6px}
.day{display:flex;flex-direction:column;gap:2px;padding-top:10px;border-top:1px dashed var(--line)}
.day-h{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-family:var(--f-num);padding-bottom:2px}
.item{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;padding:5px 0;font-size:14px}
.item .tag{font-size:11px;padding:1px 7px;border-radius:5px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.item .note{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.item .v{font-family:var(--f-num);font-weight:500;white-space:nowrap}
.del{border:0;background:none;color:var(--muted);font-size:12px;padding:4px 2px;white-space:nowrap}
.del.confirm{color:var(--bad);font-weight:700}
.total{display:flex;justify-content:space-between;border-top:2px solid var(--ink);padding-top:8px;margin-top:6px;font-weight:700}
.empty{text-align:center;color:var(--muted);font-size:14px;padding:18px 0}
.sync{font-size:11px;color:var(--muted);text-align:center}
.budget-form{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.budget-form input{width:9em;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);color:#fff;border-radius:8px;padding:5px 8px;font-family:var(--f-num)}
@media (max-width:420px){.hero-amt{font-size:30px}.stat .v{font-size:13px}.row input[type=date]{flex:1 1 100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <h1>日元记账本</h1>
    <div class="month">
      <button class="icon-btn" id="prevM" aria-label="上个月">‹</button>
      <span id="mLabel" class="num"></span>
      <button class="icon-btn" id="nextM" aria-label="下个月">›</button>
    </div>
  </header>

  <section class="panel hero" aria-label="本月概况">
    <div class="hero-row">
      <div>
        <div class="label">本月已支出</div>
        <div class="hero-amt" id="mSpent">¥0</div>
      </div>
      <div id="budgetBox"></div>
    </div>
    <div class="bar" aria-hidden="true"><i id="barFill" style="width:0"></i><b id="barMark" hidden></b></div>
    <div class="stats">
      <div class="stat"><div class="label" id="s1l">今日</div><div class="v" id="s1">¥0</div></div>
      <div class="stat"><div class="label" id="s2l">剩余预算</div><div class="v" id="s2">¥0</div></div>
      <div class="stat"><div class="label" id="s3l">每天还能花</div><div class="v" id="s3">¥0</div></div>
    </div>
  </section>

  <div id="alert" class="alert ok" role="status"><span class="dot"></span><span id="alertText"></span></div>

  <section class="panel" aria-label="记一笔">
    <h2>记一笔</h2>
    <form id="addForm" autocomplete="off">
      <label class="amt-wrap"><span>¥</span><input id="amt" inputmode="numeric" placeholder="0" aria-label="金额（日元）"></label>
      <div class="chips" id="catChips" role="group" aria-label="分类"></div>
      <div class="row">
        <input id="note" placeholder="备注（如：全家便利店）" maxlength="40">
        <input id="date" type="date" aria-label="日期">
      </div>
      <button class="primary" id="addBtn" type="submit" disabled>记录</button>
      <div class="toast" id="toast" aria-live="polite"></div>
    </form>
  </section>

  <section class="panel" aria-label="每日支出">
    <div class="top"><h2>每日支出</h2><span class="hint">虚线 = 每日预算</span></div>
    <div id="chart"></div>
  </section>

  <section class="panel" aria-label="分类">
    <h2>分类占比</h2>
    <div class="cats" id="cats"></div>
  </section>

  <section class="receipt" aria-label="明细">
    <h2>明 细</h2>
    <div class="rc-sub" id="rcSub"></div>
    <div id="list"></div>
  </section>
  <div class="sync" id="sync">数据保存在本机浏览器中</div>
</div>

<script>
const CATS=["餐饮","便利店","超市","交通","购物","娱乐","房租水电","通信","医疗","其他"];
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const yen=n=>"¥"+Math.round(n).toLocaleString("ja-JP");
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const $=id=>document.getElementById(id);

let expenses=[]; let budget=100000;
let viewMonth=ymd(new Date()).slice(0,7);
let selCat="餐饮"; let pendingDel=null;
let remote=null; // {col, settings}

// ---------- local cache ----------
function loadLocal(){try{const s=JSON.parse(localStorage.getItem("yenLedger")||"null");if(s){expenses=s.expenses||[];budget=s.budget||budget}}catch(e){}}
function saveLocal(){try{localStorage.setItem("yenLedger",JSON.stringify({expenses,budget}))}catch(e){}}

// ---------- cloud store (per-person, private) ----------
async function initRemote(){
  try{
    if(!window.claude||!window.claude.use)return;
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user)return;
    const id=await user.id(); if(!id)return;
    const base="data/users/"+id;
    const col=db.doc(base+"/ledger").collection("expenses");
    const settings=db.doc(base+"/settings");
    remote={col,settings};
    $("sync").textContent="已同步到你的账户（仅你可见）";
    // push anything recorded before the connection was ready
    const pending=expenses.filter(e=>e.pending);
    for(const e of pending){const {pending:_,...body}=e;try{await col.doc(e.id).set(body)}catch(err){}}
    settings.onSnapshot(s=>{if(s.exists&&s.data().budget){budget=s.data().budget;saveLocal();render()}},()=>{});
    col.orderBy("ts","desc").limit(1000).onSnapshot(snap=>{
      expenses=snap.docs.map(d=>({id:d.id,...d.data()}));saveLocal();render();
    },()=>{remote=null;$("sync").textContent="本机保存";});
  }catch(e){}
}

async function addExpense(e){
  if(remote){
    try{await remote.col.doc(e.id).set(e);return}catch(err){remote=null;$("sync").textContent="本机保存"}
  }
  expenses.unshift({...e,pending:true});saveLocal();render();
}
async function removeExpense(id){
  expenses=expenses.filter(e=>e.id!==id);saveLocal();render();
  if(remote){try{await remote.col.doc(id).delete()}catch(err){}}
}
async function setBudget(v){
  budget=v;saveLocal();render();
  if(remote){try{await remote.settings.set({budget:v})}catch(err){}}
}

// ---------- render ----------
function daysIn(ym){const [y,m]=ym.split("-").map(Number);return new Date(y,m,0).getDate()}
function render(){
  const today=ymd(new Date()); const curMonth=today.slice(0,7); const isCur=viewMonth===curMonth;
  const [y,m]=viewMonth.split("-").map(Number);
  $("mLabel").textContent=`${y}年${m}月`;
  $("nextM").disabled=viewMonth>=curMonth;
  const mine=expenses.filter(e=>e.date&&e.date.startsWith(viewMonth)).sort((a,b)=>b.date.localeCompare(a.date)||b.ts-a.ts);
  const spent=mine.reduce((s,e)=>s+e.amount,0);
  const dim=daysIn(viewMonth); const dayNo=isCur?new Date().getDate():dim;
  $("mSpent").textContent=yen(spent);
  if(!editingBudget)$("budgetBox").innerHTML=`<button class="budget-edit" id="editB">预算 <span class="num">${yen(budget)}</span> ✎</button>`;
  const ratio=budget?spent/budget:0;
  $("barFill").style.width=Math.min(100,ratio*100)+"%";
  const mk=$("barMark"); mk.hidden=!isCur; mk.style.left=(dayNo/dim*100)+"%";
  const left=budget-spent;
  if(isCur){
    const todaySpent=mine.filter(e=>e.date===today).reduce((s,e)=>s+e.amount,0);
    const daysLeft=dim-dayNo+1;
    $("s1l").textContent="今日";$("s1").textContent=yen(todaySpent);
    $("s2l").textContent=left>=0?"剩余预算":"已超出";$("s2").textContent=yen(Math.abs(left));
    $("s3l").textContent="每天还能花";$("s3").textContent=yen(Math.max(0,left)/daysLeft);
  }else{
    $("s1l").textContent="日均";$("s1").textContent=yen(spent/dim);
    $("s2l").textContent=left>=0?"结余":"超支";$("s2").textContent=yen(Math.abs(left));
    $("s3l").textContent="笔数";$("s3").textContent=mine.length+" 笔";
  }
  // alert
  const elapsed=dayNo/dim; let cls="ok",msg;
  if(!mine.length){msg=isCur?"本月还没有记录。记下第一笔，这里会自动提醒你的花钱速度。":"这个月没有记录。"}
  else if(spent>budget){cls="bad";msg=`${isCur?"本月":"该月"}已超支 ${yen(spent-budget)}。`+(isCur?"接下来尽量只花必要的钱。":"")}
  else if(isCur&&ratio>elapsed+0.1){cls="warn";msg=`花得偏快：已用掉预算的 ${Math.round(ratio*100)}%，但这个月才过了 ${Math.round(elapsed*100)}%。`}
  else if(ratio>=0.9){cls="warn";msg=`已用掉预算的 ${Math.round(ratio*100)}%，快到上限了。`}
  else msg=isCur?`节奏正常：已用 ${Math.round(ratio*100)}% 预算，本月已过 ${Math.round(elapsed*100)}%。`:`共支出 ${yen(spent)}，在预算之内。`;
  $("alert").className="alert "+cls;$("alertText").textContent=msg;

  renderChart(mine,dim,isCur?dayNo:dim);
  renderCats(mine,spent);
  renderList(mine,spent);
}

function renderChart(mine,dim,upto){
  const per=Array(dim).fill(0);mine.forEach(e=>{per[+e.date.slice(8)-1]+=e.amount});
  const daily=budget/dim; const max=Math.max(daily*1.4,...per,1);
  const step=niceStep(max); const top=Math.ceil(max/step)*step;
  const W=520,H=170,L=42,R=6,T=8,B=20,cw=(W-L-R)/dim;
  const yv=v=>T+(H-T-B)*(1-v/top);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="本月每日支出柱状图">`;
  for(let v=0;v<=top;v+=step){s+=`<line x1="${L}" x2="${W-R}" y1="${yv(v)}" y2="${yv(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${yv(v)+3}" text-anchor="end">${v>=10000?(v/10000)+"万":v.toLocaleString()}</text>`}
  per.forEach((v,i)=>{if(!v)return;const x=L+i*cw+cw*0.18,w=cw*0.64,over=v>daily;
    s+=`<rect x="${x}" y="${yv(v)}" width="${w}" height="${yv(0)-yv(v)}" rx="1.5" fill="${over?"var(--warn)":"var(--accent)"}"><title>${i+1}日 ${yen(v)}</title></rect>`});
  s+=`<line x1="${L}" x2="${W-R}" y1="${yv(daily)}" y2="${yv(daily)}" stroke="var(--bad)" stroke-dasharray="4 3" stroke-width="1.2"/>`;
  [1,10,20,dim].forEach(d=>{s+=`<text x="${L+(d-0.5)*cw}" y="${H-5}" text-anchor="middle">${d}</text>`});
  s+="</svg>";$("chart").innerHTML=s;
}
function niceStep(max){const raw=max/4,p=Math.pow(10,Math.floor(Math.log10(raw))),n=raw/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p}

function renderCats(mine,spent){
  const by={};mine.forEach(e=>{by[e.cat]=(by[e.cat]||0)+e.amount});
  const rows=Object.entries(by).sort((a,b)=>b[1]-a[1]);
  if(!rows.length){$("cats").innerHTML=`<div class="empty">记账后这里会显示钱都花在哪了</div>`;return}
  const max=rows[0][1];
  $("cats").innerHTML=rows.map(([c,v])=>`<div class="cat"><span>${c}</span><div class="track"><i style="width:${v/max*100}%"></i></div><span class="v">${yen(v)}<span class="pct">${Math.round(v/spent*100)}%</span></span></div>`).join("");
}

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
const WD="日一二三四五六";
function renderList(mine,spent){
  $("rcSub").textContent=`${mine.length} 件 · ${$("mLabel").textContent}`;
  if(!mine.length){$("list").innerHTML=`<div class="empty">还没有记录。在上面输入金额、选分类，点“记录”就行。</div>`;return}
  const groups={};mine.forEach(e=>{(groups[e.date]=groups[e.date]||[]).push(e)});
  let h="";
  Object.keys(groups).sort().reverse().forEach(d=>{
    const items=groups[d],sum=items.reduce((s,e)=>s+e.amount,0),dt=new Date(d+"T00:00");
    h+=`<div class="day"><div class="day-h"><span>${+d.slice(5,7)}/${+d.slice(8)}（${WD[dt.getDay()]}）</span><span>小计 ${yen(sum)}</span></div>`;
    items.forEach(e=>{h+=`<div class="item"><span class="tag">${esc(e.cat)}</span><span class="note">${esc(e.note||"")}</span><span class="v">${yen(e.amount)}</span><button class="del${pendingDel===e.id?" confirm":""}" data-id="${e.id}">${pendingDel===e.id?"确认删除":"删除"}</button></div>`});
    h+="</div>";
  });
  h+=`<div class="total"><span>合计</span><span class="num">${yen(spent)}</span></div>`;
  $("list").innerHTML=h;
}

// ---------- interactions ----------
let editingBudget=false;
$("budgetBox").addEventListener("click",ev=>{
  if(ev.target.closest("#editB")){editingBudget=true;
    $("budgetBox").innerHTML=`<form class="budget-form" id="bForm"><input id="bIn" inputmode="numeric" value="${budget}" aria-label="每月预算"><button class="budget-edit" type="submit">保存</button></form>`;
    const i=$("bIn");i.focus();i.select();
    $("bForm").addEventListener("submit",e=>{e.preventDefault();const v=parseInt(i.value.replace(/[^\d]/g,""),10);editingBudget=false;if(v>0)setBudget(v);else render()});
  }
});
$("catChips").innerHTML=CATS.map(c=>`<button type="button" class="chip" aria-pressed="${c===selCat}" data-c="${c}">${c}</button>`).join("");
$("catChips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;selCat=b.dataset.c;
  document.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",x.dataset.c===selCat))});
const amt=$("amt");
const parseAmt=()=>parseInt(amt.value.replace(/[^\d]/g,""),10)||0;
amt.addEventListener("input",()=>{const n=parseAmt();amt.value=n?n.toLocaleString("ja-JP"):"";$("addBtn").disabled=!n});
$("date").value=ymd(new Date());$("date").max=ymd(new Date());
$("addForm").addEventListener("submit",async ev=>{
  ev.preventDefault();const n=parseAmt();if(!n)return;
  const e={id:uid(),amount:n,cat:selCat,note:$("note").value.trim(),date:$("date").value||ymd(new Date()),ts:Date.now()};
  amt.value="";$("note").value="";$("addBtn").disabled=true;
  if(e.date.slice(0,7)!==viewMonth)viewMonth=e.date.slice(0,7);
  $("toast").textContent=`已记录 ${yen(n)}（${e.cat}）`;
  await addExpense(e);setTimeout(()=>{$("toast").textContent=""},2500);
});
$("list").addEventListener("click",e=>{const b=e.target.closest(".del");if(!b)return;
  if(pendingDel===b.dataset.id){pendingDel=null;removeExpense(b.dataset.id)}else{pendingDel=b.dataset.id;render()}});
function shift(d){const [y,m]=viewMonth.split("-").map(Number);const t=new Date(y,m-1+d,1);viewMonth=ymd(t).slice(0,7);pendingDel=null;render()}
$("prevM").onclick=()=>shift(-1);$("nextM").onclick=()=>shift(1);

loadLocal();render();initRemote();
</script>

</body>
</html>
